<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wilder Westen</title>
<style>*{box-sizing:border-box;touch-action:none;user-select:none}body{margin:0;min-height:100vh;background:#2b1d12;color:#f3e3c3;font-family:Georgia,serif;display:flex;flex-direction:column}
#top{padding:8px;text-align:center;background:#1c120a}#inv,#jobs,#st{font-size:.85rem;text-align:center;padding:2px 8px}#msg{min-height:30px;text-align:center;color:#ffb347;padding:4px}
#city,#in,#game{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:10px;text-align:center}
#joy{width:180px;height:180px;border-radius:50%;background:#4a2f15;position:relative}#knob{width:70px;height:70px;border-radius:50%;background:#c27a2c;position:absolute;left:55px;top:55px}
button{font:inherit;font-size:1.1rem;padding:12px 18px;border:0;border-radius:10px;background:#c27a2c;color:#fff;min-width:180px}button:disabled{background:#555}
.rc{width:100%;max-width:340px}.rc button{width:100%;text-align:left}.rc small{display:block;opacity:.85;font-size:.8rem}
#bells,#give{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}#bells button,#give button{min-width:0;padding:10px 12px;font-size:.95rem}[hidden]{display:none!important}
#tb{position:relative;width:300px;height:40px;background:#555;border-radius:8px;margin:20px auto}.tz{position:absolute;top:0;bottom:0;background:#6bbf59;opacity:.85}.tm{position:absolute;top:-6px;width:6px;height:52px;background:#fff;margin-left:-3px}
.mb{display:grid;grid-template-columns:repeat(3,80px);gap:8px;justify-content:center}.mb button{min-width:0;font-size:2rem;padding:10px}
#sb{width:280px;height:18px;background:#555;border-radius:9px;overflow:hidden}#sf{display:block;height:100%;width:0;background:#6bbf59}</style>
<div id=top>Verbinde …</div><div id=inv></div><div id=jobs></div><div id=st></div><div id=msg></div>
<div id=city hidden><div id=joy><div id=knob></div></div><button id=act></button><div id=bells hidden><button data-s=1>🔔 Mangel</button><button data-s=2>🔔 Angriff</button><button data-s=3>🔔 Feuer</button></div><button id=deliver hidden>📦 Waren abliefern</button><div id=give></div></div>
<div id=in hidden><h2 id=bn></h2><div id=rec class=rc></div><div id=nothing hidden>Hier gibt es für dich nichts zu tun.</div><button id=leave>Gebäude verlassen</button></div>
<div id=game hidden><h2 id=gt></h2><p id=gh></p><div id=ga></div></div>
<script src=/socket.io/socket.io.js></script>
<script>
const $=i=>document.getElementById(i),slot=+new URLSearchParams(location.search).get('slot'),s=io(),vib=p=>navigator.vibrate&&navigator.vibrate(p);
let playing=false,lastKey='';
s.on('connect',()=>s.emit('join',slot));s.on('err',t=>$('top').textContent=t);
let mt;const note=t=>{$('msg').textContent=t;clearTimeout(mt);mt=setTimeout(()=>$('msg').textContent='',7000)};
s.on('msg',t=>{note(t);vib(40)});
s.on('alert',a=>{note('🔔 '+a.txt);vib(a.sig===1?200:[200,100,200,100,200])});
const SN={food:'Nahrung',ammo:'Munition',med:'Medizin',morale:'Moral',security:'Sicherheit'};
s.on('me',m=>{
 $('top').innerHTML='<b>'+m.role+'</b>';
 $('inv').textContent='🎒 '+(Object.entries(m.inv).map(([k,v])=>k+' ×'+v).join(' · ')||'leer');
 $('jobs').textContent=m.jobs.map(j=>'⏳ '+j.n+' ('+j.s+' s)').join('  ');
 $('st').textContent=Object.entries(m.stats).map(([k,v])=>SN[k]+' '+v).join(' · ');
 if(playing)return;
 $('game').hidden=true;$('city').hidden=!!m.inside;$('in').hidden=!m.inside;
 const key=JSON.stringify([m.inside,m.recipes,m.near,m.nearby,m.invKeys,m.cd>0]);
 if(!m.inside){const a=$('act');a.disabled=!m.near||m.near==='Kirche';a.textContent=!m.near?'Lauf zu einem Gebäude':m.near==='Kirche'?'Am Glockenturm':'Betreten: '+m.near;
  $('bells').hidden=$('deliver').hidden=m.near!=='Kirche';}
 if(key===lastKey)return;lastKey=key;
 [...$('bells').children].forEach(b=>b.disabled=m.cd>0);
 $('give').innerHTML=m.nearby.map(q=>m.invKeys.map(k=>`<button data-to="${q}" data-k="${k}">→ S${q+1}: ${k}</button>`).join('')).join('');
 if(m.inside){$('bn').textContent=m.inside;$('nothing').hidden=m.mine;
  $('rec').innerHTML=m.recipes.map(r=>`<button data-r="${r.id}" ${r.ok?'':'disabled'}>${r.n}<small>${r.i} → ${r.o} (${r.t} s)</small></button>`).join('')}
});
$('act').onclick=()=>s.emit('act');$('leave').onclick=()=>s.emit('act');$('deliver').onclick=()=>s.emit('deliver');
$('rec').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.r)s.emit('craft',b.dataset.r)};
$('bells').onclick=e=>{const v=e.target.dataset.s;if(v)s.emit('bell',+v)};
$('give').onclick=e=>{const b=e.target.closest('button');if(b)s.emit('give',{to:+b.dataset.to,item:b.dataset.k})};
const NAMEKEY={Erz:'ore',Kohle:'coal',Eisenbarren:'bar',Munition:'ammo',Fleisch:'meat',Fell:'hide','Kräuter':'herbs',Medizin:'med',Holz:'wood',Bretter:'planks',Zaun:'fence',Essen:'food',Whiskey:'whiskey',Wache:'guard'};
s.on('game',g=>{playing=true;$('city').hidden=$('in').hidden=true;$('game').hidden=false;$('gt').textContent=g.n;$('gh').textContent=g.h||'';$('ga').innerHTML='';
 G[g.g]($('ga'),sc=>{s.emit('result',sc);playing=false;lastKey='';$('game').hidden=true})});
const SYM=['🔥','💧','⚒️','🌿','💀','⭐'];
const G={
 timing(a,done){let r=0,tot=0,x=0,d=1,v=.9,zc,zw,run=1;
  a.innerHTML='<div id=tb><i class=tz id=tz></i><b class=tm id=tm></b></div><p id=tr></p><button id=tg>STOPP</button>';
  const z=$('tz'),m=$('tm'),t=$('tr');
  const nr=()=>{zw=.24-r*.05;zc=.15+Math.random()*.7;z.style.left=(zc-zw/2)*100+'%';z.style.width=zw*100+'%';v=.9+r*.5;t.textContent='Runde '+(r+1)+'/3'};nr();
  let last=performance.now();(function f(n){if(!run)return;x+=d*v*(n-last)/1000;last=n;if(x>1){x=1;d=-1}if(x<0){x=0;d=1}m.style.left=x*100+'%';requestAnimationFrame(f)})(last);
  $('tg').onclick=()=>{tot+=Math.max(0,1-Math.abs(x-zc)/zw);vib(30);if(++r>=3){run=0;done(tot/3)}else nr()}},
 memory(a,done){const L=4,seq=[...Array(L)].map(()=>Math.random()*6|0);let i=0,ok=0;
  a.innerHTML='<div id=ms style="font-size:4rem;height:80px"></div><div class=mb id=mb></div>';
  const ms=$('ms'),mb=$('mb');mb.hidden=true;
  mb.innerHTML=SYM.map((y,k)=>`<button data-k="${k}">${y}</button>`).join('');
  let n=0;(function show(){if(n<L){ms.textContent=SYM[seq[n++]];setTimeout(()=>{ms.textContent='';setTimeout(show,250)},650)}else{ms.textContent='Jetzt du!';mb.hidden=false}})();
  mb.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(+b.dataset.k===seq[i])ok++;vib(25);if(+b.dataset.k!==seq[i]||++i>=L)done(ok/L)}},
 hotcold(a,done){const T=Math.random()*100;let tries=0;
  a.innerHTML='<input id=hs type=range min=0 max=100 value=50 style="width:260px"><p id=hf>Schiebe den Regler und prüfe.</p><button id=hb>Prüfen</button>';
  $('hb').onclick=()=>{tries++;const d=Math.abs(+$('hs').value-T);
   $('hf').textContent=(d<=4?'🎯 Treffer!':d<10?'🔥 kochend heiß':d<20?'♨️ heiß':d<35?'🙂 warm':d<55?'❄️ kalt':'🧊 eiskalt')+' ('+tries+'/6)';
   vib(d<10?[60,40,60]:20);if(d<=4)setTimeout(()=>done(Math.max(.5,1-(tries-1)*.1)),700);else if(tries>=6)setTimeout(()=>done(.25),700)}},
 stealth(a,done){let p=0,look=false,hold=0,fails=0,last=performance.now(),t0=last,next=last+1500,run=1;
  a.innerHTML='<div id=ey style="font-size:5rem"></div><div id=sb><i id=sf></i></div><p id=sm>Halte gedrückt und schleiche an.</p><button id=sh>Anschleichen (halten)</button>';
  const b=$('sh');b.onpointerdown=()=>hold=1;b.onpointerup=b.onpointerleave=b.onpointercancel=()=>hold=0;
  (function f(n){if(!run)return;const dt=(n-last)/1000;last=n;
   if(n>next){look=!look;next=n+(look?700+Math.random()*900:1200+Math.random()*1500)}
   $('ey').textContent=look?'👀':(next-n<350?'⚠️':'🦌');
   if(hold){if(look){p=Math.max(0,p-.3);fails++;hold=0;vib(150);$('sm').textContent='Das Tier hat dich gesehen!'}else p+=.25*dt}
   $('sf').style.width=Math.min(100,p*100)+'%';
   if(p>=1){run=0;return done(Math.max(.4,1-fails*.2))}
   if(n-t0>30000){run=0;return done(p*.5)}requestAnimationFrame(f)})(last)}};
const j=$('joy'),k=$('knob');let on=false;
function mv(e){if(!on)return;const r=j.getBoundingClientRect(),R=60;let x=e.clientX-r.left-90,y=e.clientY-r.top-90,l=Math.hypot(x,y);if(l>R){x*=R/l;y*=R/l}
 k.style.left=55+x+'px';k.style.top=55+y+'px';s.emit('input',{dx:x/R,dy:y/R})}
j.onpointerdown=e=>{on=true;j.setPointerCapture(e.pointerId);mv(e)};j.onpointermove=mv;
j.onpointerup=j.onpointercancel=()=>{on=false;k.style.left=k.style.top='55px';s.emit('input',{dx:0,dy:0})};
</script>
