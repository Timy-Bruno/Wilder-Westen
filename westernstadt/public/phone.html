<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wilder Westen</title><link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel=stylesheet>
<style>:root{--w:#3a2616;--b:#6b4a2a;--g:#f4c06a}
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
body{margin:0;min-height:100dvh;background:radial-gradient(120% 70% at 50% 0,#4a2f18,#1a0f07);color:#f3e3c3;font-family:Georgia,serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#120a04;border-bottom:3px solid var(--b)}
#ric{font-size:2.2rem}#rn{font-family:Rye,Georgia,serif;font-size:1.5rem;color:var(--g)}
#stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px 4px}
.st{background:var(--w);border:1px solid var(--b);border-radius:10px;padding:4px 2px;text-align:center;font-size:1.1rem}.st b{display:block;font-size:.95rem}.st small{display:block;font-size:.55rem;opacity:.75}
.st i{display:block;height:5px;background:#555;border-radius:3px;margin:3px 6px 0;overflow:hidden}.st u{display:block;height:100%;background:#6bbf59}.st.low u{background:#e74c3c}.st.low{border-color:#e74c3c}
h3{margin:6px 12px 2px;font-size:.8rem;letter-spacing:.1em;color:var(--g);text-transform:uppercase}
#pack{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 10px}
.it{background:var(--w);border:2px solid var(--b);border-radius:12px;padding:6px 3px;text-align:center;position:relative}.it.sell{border-color:var(--g);box-shadow:0 0 10px #f4c06a66}
.it span{font-size:1.8rem}.it b{position:absolute;top:2px;right:7px;font-size:1.05rem;color:var(--g)}.it small{display:block;font-size:.72rem}.it em{display:block;font-size:.58rem;opacity:.75;font-style:normal;line-height:1.1}
#empty{grid-column:1/-1;text-align:center;opacity:.6;padding:8px}
.job{display:flex;align-items:center;gap:8px;background:#2a1a0d;border-radius:10px;padding:6px 10px;margin:4px 10px 0;font-size:.82rem}.job i{flex:1;height:6px;background:#555;border-radius:3px;overflow:hidden}.job u{display:block;height:100%;background:var(--g)}
#city,#in,#game{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:10px;text-align:center}
#joy{width:170px;height:170px;border-radius:50%;background:radial-gradient(#5a3a1c,#3a2410);border:3px solid var(--b);position:relative}#knob{width:66px;height:66px;border-radius:50%;background:radial-gradient(#e9a550,#b8661a);position:absolute;left:51px;top:51px;box-shadow:0 3px 6px #0008}
button{font:inherit;font-weight:bold;font-size:1.05rem;padding:13px 18px;border:0;border-radius:12px;background:linear-gradient(#d98d3a,#b8661a);color:#fff;box-shadow:0 4px 0 #6e3b0c;min-width:190px}button:active{transform:translateY(3px);box-shadow:0 1px 0 #6e3b0c}button:disabled{background:#555;box-shadow:0 4px 0 #333;color:#aaa}
.rc{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}.rc button{width:100%;text-align:left}.rc small{display:block;font-weight:normal;font-size:.78rem;margin-top:3px;opacity:.95}
#bells,#give{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}#bells button,#give button{min-width:0;padding:10px 12px;font-size:.9rem}
.gv{width:100%;background:var(--w);border-radius:12px;padding:8px}.gv p{margin:0 0 6px;font-size:.85rem}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:#f4c06a;color:#2b1d12;border-radius:12px;padding:12px;text-align:center;font-weight:bold;box-shadow:0 4px 14px #000a;z-index:9}#toast.al{background:#c0392b;color:#fff}
[hidden]{display:none!important}
#tb{position:relative;width:300px;height:40px;background:#555;border-radius:8px;margin:20px auto}.tz{position:absolute;top:0;bottom:0;background:#6bbf59;opacity:.85}.tm{position:absolute;top:-6px;width:6px;height:52px;background:#fff;margin-left:-3px}
.mb{display:grid;grid-template-columns:repeat(3,80px);gap:8px;justify-content:center}.mb button{min-width:0;font-size:2rem;padding:10px}
#sb{width:280px;height:18px;background:#555;border-radius:9px;overflow:hidden}#sf{display:block;height:100%;width:0;background:#6bbf59}</style></head><body>
<header><span id=ric>🤠</span><div id=rn>Verbinde …</div></header>
<div id=stats></div><h3>🎒 Rucksack</h3><div id=pack></div><div id=jobs></div>
<div id=city hidden><div id=joy><div id=knob></div></div><button id=act></button><div id=bells hidden><button data-s=1>🔔 Mangel</button><button data-s=2>🔔 Angriff</button><button data-s=3>🔔 Feuer</button></div><button id=deliver hidden></button><div id=give></div></div>
<div id=in hidden><h2 id=bn style="font-family:Rye,Georgia,serif;color:#f4c06a;margin:0"></h2><div id=rec class=rc></div><div id=nothing hidden>Hier gibt es für dich nichts zu tun.</div><button id=leave>Gebäude verlassen</button></div>
<div id=game hidden><h2 id=gt style="font-family:Rye,Georgia,serif;color:#f4c06a;margin:0"></h2><p id=gh></p><div id=ga></div></div>
<div id=toast hidden></div>
<script src=/socket.io/socket.io.js></script>
<script>
const $=i=>document.getElementById(i),slot=+new URLSearchParams(location.search).get('slot'),s=io(),vib=p=>navigator.vibrate&&navigator.vibrate(p);
let playing=false,lastKey='',packKey='',mt;
const ST=[['food','🍖','Nahrung'],['ammo','🔫','Munition'],['med','💊','Medizin'],['morale','🎭','Moral'],['security','🛡️','Schutz']];
$('stats').innerHTML=ST.map(([k,i,n])=>`<div class=st id=st_${k}>${i}<b>0</b><small>${n}</small><i><u></u></i></div>`).join('');
const note=(t,al)=>{const e=$('toast');e.textContent=t;e.className=al?'al':'';e.hidden=false;clearTimeout(mt);mt=setTimeout(()=>e.hidden=true,6500)};
s.on('connect',()=>s.emit('join',slot));s.on('err',t=>$('rn').textContent=t);
s.on('msg',t=>{note(t);vib(40)});
s.on('alert',a=>{note('🔔 '+a.txt,1);vib(a.sig===1?200:[200,100,200,100,200])});
s.on('me',m=>{
 $('ric').textContent=m.icon;$('rn').textContent=m.role;
 ST.forEach(([k])=>{const e=$('st_'+k),v=m.stats[k];e.querySelector('b').textContent=v;e.querySelector('u').style.width=v+'%';e.classList.toggle('low',v<30)});
 $('jobs').innerHTML=m.jobs.map(j=>`<div class=job>⏳ ${j.n}<i><u style="width:${100-j.s/j.d*100}%"></u></i>${j.s}s</div>`).join('');
 const pk=JSON.stringify(m.inv);if(pk!==packKey){packKey=pk;
  $('pack').innerHTML=m.inv.length?m.inv.map(i=>`<div class="it ${i.sell?'sell':''}"><span>${i.icon}</span><b>${i.n}</b><small>${i.name}</small><em>${i.hint}</em></div>`).join(''):'<div id=empty>Leer – stelle etwas her oder lass dir etwas geben.</div>'}
 if(playing)return;
 $('game').hidden=true;$('city').hidden=!!m.inside;$('in').hidden=!m.inside;
 const sell=m.inv.filter(i=>i.sell),key=JSON.stringify([m.inside,m.recipes,m.near,m.nearby,m.invKeys,m.cd>0]);
 if(!m.inside){const a=$('act');a.disabled=!m.near||m.near==='Kirche';a.textContent=!m.near?'🚶 Lauf zu einem Gebäude':m.near==='Kirche'?'⛪ Am Glockenturm':'🚪 Betreten: '+m.near;
  $('bells').hidden=$('deliver').hidden=m.near!=='Kirche';
  const d=$('deliver');d.disabled=!sell.length;d.textContent=sell.length?'📦 Abliefern: '+sell.map(i=>i.n+'× '+i.name).join(', '):'📦 Nichts abzuliefern (erst verarbeiten)'}
 if(key===lastKey)return;lastKey=key;
 [...$('bells').children].forEach(b=>b.disabled=m.cd>0);
 $('give').innerHTML=m.nearby.map(q=>`<div class=gv><p>🤝 Spieler ${q+1} ist in der Nähe – übergeben:</p>${m.inv.map(i=>`<button data-to="${q}" data-k="${i.k}">${i.icon} ${i.name}</button>`).join('')}</div>`).join('');
 if(m.inside){$('bn').textContent=m.inside;$('nothing').hidden=m.mine;
  $('rec').innerHTML=m.recipes.map(r=>`<button data-r="${r.id}" ${r.ok?'':'disabled'}>🔧 ${r.n}<small>${r.i}  ➜  ${r.o}</small><small>⏱ ${r.t} s${r.ok?'':' · Material fehlt'}</small></button>`).join('')}
});
$('act').onclick=()=>s.emit('act');$('leave').onclick=()=>s.emit('act');$('deliver').onclick=()=>s.emit('deliver');
$('rec').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.r)s.emit('craft',b.dataset.r)};
$('bells').onclick=e=>{const v=e.target.dataset.s;if(v)s.emit('bell',+v)};
$('give').onclick=e=>{const b=e.target.closest('button');if(b)s.emit('give',{to:+b.dataset.to,item:b.dataset.k})};
s.on('game',g=>{playing=true;$('city').hidden=$('in').hidden=true;$('game').hidden=false;$('gt').textContent=g.n;$('gh').textContent=g.h||'';$('ga').innerHTML='';
 G[g.g]($('ga'),sc=>{s.emit('result',sc);playing=false;lastKey='';$('game').hidden=true})});
const SYM=['🔥','💧','⚒️','🌿','💀','⭐'];
const G={
 timing(a,done){let r=0,tot=0,x=0,d=1,v=.9,zc,zw,run=1;
  a.innerHTML='<div id=tb><i class=tz id=tz></i><b class=tm id=tm></b></div><p id=tr></p><button id=tg>STOPP</button>';
  const z=$('tz'),m=$('tm'),t=$('tr');
  const nr=()=>{zw=.24-r*.05;zc=.15+Math.random()*.7;z.style.left=(zc-zw/2)*100+'%';z.style.width=zw*100+'%';v=.9+r*.5;t.textContent='Runde '+(r+1)+'/3'};nr();
  let last=performance.now();(function f(n){if(!run)return;x+=d*v*(n-last)/1000;last=n;if(x>1){x=1;d=-1}if(x<0){x=0;d=1}m.style.left=x*100+'%';requestAnimationFrame(f)})(last);
  $('tg').onclick=()=>{tot+=Math.max(0,1-Math.abs(x-zc)/zw);vib(30);if(++r>=3){run=0;done(tot/3)}else nr()}},
 memory(a,done){const L=4,seq=[...Array(L)].map(()=>Math.random()*6|0);let i=0,ok=0;
  a.innerHTML='<div id=ms style="font-size:4rem;height:80px"></div><div class=mb id=mb></div>';
  const ms=$('ms'),mb=$('mb');mb.hidden=true;
  mb.innerHTML=SYM.map((y,k)=>`<button data-k="${k}">${y}</button>`).join('');
  let n=0;(function show(){if(n<L){ms.textContent=SYM[seq[n++]];setTimeout(()=>{ms.textContent='';setTimeout(show,250)},650)}else{ms.textContent='Jetzt du!';mb.hidden=false}})();
  mb.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(+b.dataset.k===seq[i])ok++;vib(25);if(+b.dataset.k!==seq[i]||++i>=L)done(ok/L)}},
 hotcold(a,done){const T=Math.random()*100;let tries=0;
  a.innerHTML='<input id=hs type=range min=0 max=100 value=50 style="width:260px"><p id=hf>Schiebe den Regler und prüfe.</p><button id=hb>Prüfen</button>';
  $('hb').onclick=()=>{tries++;const d=Math.abs(+$('hs').value-T);
   $('hf').textContent=(d<=4?'🎯 Treffer!':d<10?'🔥 kochend heiß':d<20?'♨️ heiß':d<35?'🙂 warm':d<55?'❄️ kalt':'🧊 eiskalt')+' ('+tries+'/6)';
   vib(d<10?[60,40,60]:20);if(d<=4)setTimeout(()=>done(Math.max(.5,1-(tries-1)*.1)),700);else if(tries>=6)setTimeout(()=>done(.25),700)}},
 stealth(a,done){let p=0,look=false,hold=0,fails=0,last=performance.now(),t0=last,next=last+1500,run=1;
  a.innerHTML='<div id=ey style="font-size:5rem"></div><div id=sb><i id=sf></i></div><p id=sm>Halte gedrückt und schleiche an.</p><button id=sh>Anschleichen (halten)</button>';
  const b=$('sh');b.onpointerdown=()=>hold=1;b.onpointerup=b.onpointerleave=b.onpointercancel=()=>hold=0;
  (function f(n){if(!run)return;const dt=(n-last)/1000;last=n;
   if(n>next){look=!look;next=n+(look?700+Math.random()*900:1200+Math.random()*1500)}
   $('ey').textContent=look?'👀':(next-n<350?'⚠️':'🦌');
   if(hold){if(look){p=Math.max(0,p-.3);fails++;hold=0;vib(150);$('sm').textContent='Das Tier hat dich gesehen!'}else p+=.25*dt}
   $('sf').style.width=Math.min(100,p*100)+'%';
   if(p>=1){run=0;return done(Math.max(.4,1-fails*.2))}
   if(n-t0>30000){run=0;return done(p*.5)}requestAnimationFrame(f)})(last)}};
const j=$('joy'),k=$('knob');let on=false;
function mv(e){if(!on)return;const r=j.getBoundingClientRect(),R=58;let x=e.clientX-r.left-85,y=e.clientY-r.top-85,l=Math.hypot(x,y);if(l>R){x*=R/l;y*=R/l}
 k.style.left=52+x+'px';k.style.top=52+y+'px';s.emit('input',{dx:x/R,dy:y/R})}
j.onpointerdown=e=>{on=true;j.setPointerCapture(e.pointerId);mv(e)};j.onpointermove=mv;
j.onpointerup=j.onpointercancel=()=>{on=false;k.style.left=k.style.top='52px';s.emit('input',{dx:0,dy:0})};
</script></body></html>
