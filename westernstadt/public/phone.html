<style>:root{--w:#3a2616;--b:#6b4a2a;--g:#f4c06a}

<script>
const $=i=>document.getElementById(i),slot=+new URLSearchParams(location.search).get('slot'),s=io(),vib=p=>navigator.vibrate&&navigator.vibrate(p);
attachGameUpdates(s);
let tab='map',lastKey='',mt,SK={};

$('stats').innerHTML=ST.map(([k,i])=>`<div class=st id=st_${k}>${i}<b>0</b><i><u></u></i></div>`).join('');
function showTab(){['map','pack','ord'].forEach(t=>$('v_'+t).hidden=t!==tab);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}

const set=(id,html)=>{if(SK[id]!==html){SK[id]=html;$(id).innerHTML=html}};
s.on('me',m=>{
 const field=m.woodland,trap=field?.trap,repair=m.workshop?.own;$('woodlandCard').hidden=!field;
 set('woodlandCard',!field?'':field.repairId?'⚒️ '+(repair?.state==='ready'?'Deine Falle ist fertig. In der Schmiede abholen.':'Deine Falle ist zur Reparatur in der Schmiede.'):trap?'🪤 '+(trap.state==='caught'?'Deine Falle hat gefangen! Im Wald den Fang bergen.':trap.state==='broken'?'Die Falle ist defekt. Im Wald aufnehmen und zur Schmiede bringen.':trap.state==='empty'?'Falle leer im Wald. Erneut spannen oder aufnehmen.':'Falle scharf im Wald. Sie wartet auf Kleinwild.')+' Zustand '+field.condition+'/3.':field.condition?'🪤 Falle im Gepäck · Zustand '+field.condition+'/3. Reparatur bei Bedarf in der Schmiede.':'🪤 Falle defekt im Gepäck. Zur Schmiede bringen · 1 Erz und 1 Kohle.');
 $('ric').textContent=m.icon;$('rn').textContent=m.role;
 ST.forEach(([k])=>{const e=$('st_'+k),v=m.stats[k];e.querySelector('b').textContent=v;e.querySelector('u').style.width=v+'%';e.classList.toggle('low',v<30)});
 set('pack',m.inv.length?m.inv.map(i=>`<div class="it ${i.sell?'sell':''}"><span>${i.icon}</span><b>${i.n}</b><small>${i.name}</small><em>${i.hint}</em></div>`).join(''):'<div class=muted style="grid-column:1/-1">Leer – stelle etwas her oder lass dir etwas geben.</div>');
 set('jobs',m.jobs.map(j=>`<div class=job>⏳ ${j.n}<i><u style="width:${100-j.s/j.d*100}%"></u></i>${j.s}s</div>`).join(''));
 set('give',m.nearby.map(q=>`<div class=gv><p>🤝 Spieler ${q+1} ist in der Nähe – übergeben:</p>${m.inv.map(i=>`<button data-to="${q}" data-k="${i.k}">${i.icon} ${i.name}</button>`).join('')}</div>`).join(''));
 const O=m.orders,ready=O.mine.filter(o=>o.st==='ready').length,n=O.inc.filter(o=>o.st==='open').length+ready+(m.workshop?.incoming.filter(j=>j.state==='open').length||0)+(m.workshop?.own?.state==='ready'?1:0)+(m.townTasks?.entries.some(j=>j.owned&&j.ready)?1:0);
 $('badge').hidden=!n;$('badge').textContent=n;
 set('inc',O.inc.length?O.inc.map(o=>`<div class=oc>📋 ${o.n}<br><small>von Spieler ${o.from+1} · ${o.st==='work'?'🔧 in Arbeit':'offen – geh in dein Gebäude'}</small></div>`).join(''):'<div class=muted>Keine Aufträge.</div>');
 set('mine',O.mine.length?O.mine.map(o=>`<div class=oc>${o.st==='ready'?'✅':o.st==='work'?'🔧':'⏳'} ${o.n}<br><small>${o.st==='ready'?'fertig – abholen in: '+o.b:'in: '+o.b+' · '+(o.st==='work'?'wird bearbeitet':'wartet')}</small></div>`).join(''):'<div class=muted>Keine Bestellungen. Geh in ein fremdes Gebäude, um etwas zu bestellen.</div>');
 $('city').hidden=!!m.inside;$('in').hidden=!m.inside;
 if(!m.inside){const a=$('act'),sell=m.inv.filter(i=>i.sell);a.disabled=!m.near||m.near==='Kirche'||m.near==='Laden';a.textContent=!m.near?'🚶 Lauf zu einem Gebäude':m.near==='Kirche'?'⛪ Am Glockenturm':m.near==='Laden'?'Durch die Ladentür laufen':'🚪 Betreten: '+m.near;
  $('bells').hidden=$('deliver').hidden=m.near!=='Kirche';[...$('bells').children].forEach(b=>b.disabled=m.cd>0);
  const d=$('deliver');d.disabled=!sell.length;d.textContent=sell.length?'📦 Abliefern: '+sell.map(i=>i.n+'× '+i.name).join(', '):'📦 Nichts abzuliefern (erst verarbeiten)'}
 else{$('bn').textContent=m.inside;let h='';
  if(m.mine){h+=m.recipes.map(r=>`<button data-r="${r.id}" ${r.ok?'':'disabled'}>🔧 ${r.n}<small>${r.i}  ➜  ${r.o}</small><small>${r.id==='hunt'?'Wald erkunden · eigene Jagdvorräte':'⏱ '+r.t+' s'}${r.ok?'':' · Material fehlt oder beschäftigt'}</small></button>`).join('');
   h+=O.inc.filter(o=>o.st==='open'&&(!m.interior||m.interior.station?.recipes?.includes(o.rid))).map(o=>`<button data-f="${o.id}">📋 Auftrag von Spieler ${o.from+1}<small>${o.n} – Material liegt bereit</small></button>`).join('')}
  else{const b=m.bld;h+=b.pick.map(o=>`<button data-c="${o.id}">✅ Abholen: ${o.n}</button>`).join('');
   if(!b.provider)h+='<div class=muted>Hier arbeitet gerade niemand.</div>';
   else{h+=b.svc.map(x=>`<button data-o="${x.id}" ${x.ok?'':'disabled'}>📋 Bestellen: ${x.n}<small>${x.i}  ➜  ${x.o}</small><small>⏱ ${x.t} s${x.ok?'':' · Material fehlt'}</small></button>`).join('');
    if(!b.svc.length&&!b.pick.length)h+='<div class=muted>Hier gibt es nichts zu bestellen.</div>'}}
  set('rec',h)}
});
if(document.documentElement.requestFullscreen){$('fs').hidden=false;$('fs').onclick=()=>document.documentElement.requestFullscreen().catch(()=>{})}
$('act').onclick=()=>s.emit('act');$('leave').onclick=()=>s.emit('act');$('deliver').onclick=()=>s.emit('deliver');
$('rec').onclick=e=>{const b=e.target.closest('button'),d=b&&b.dataset;if(!d)return;
 if(d.r)s.emit('craft',d.r);else if(d.f)s.emit('fulfill',+d.f);else if(d.o)s.emit('order',d.o);else if(d.c)s.emit('collect',+d.c)};
$('bells').onclick=e=>{const v=e.target.dataset.s;if(v)s.emit('bell',+v)};
$('give').onclick=e=>{const b=e.target.closest('button');if(b)s.emit('give',{to:+b.dataset.to,item:b.dataset.k})};
s.on('game',g=>{$('game').hidden=false;$('gt').textContent=g.n;$('gh').textContent=g.h||'';$('ga').innerHTML='';
 G[g.g]($('ga'),sc=>{s.emit('result',sc);$('game').hidden=true})});
const SYM=['🔥','💧','⚒️','🌿','💀','⭐'];
const G={
 timing(a,done){let r=0,tot=0,x=0,d=1,v=.9,zc,zw,run=1;
  a.innerHTML='<div id=tb><i class=tz id=tz></i><b class=tm id=tm></b></div><p id=tr></p><button id=tg>STOPP</button>';
  const z=$('tz'),m=$('tm'),t=$('tr');
  const nr=()=>{zw=.24-r*.05;zc=.15+Math.random()*.7;z.style.left=(zc-zw/2)*100+'%';z.style.width=zw*100+'%';v=.9+r*.5;t.textContent='Runde '+(r+1)+'/3'};nr();
  let last=performance.now();(function f(n){if(!run)return;x+=d*v*(n-last)/1000;last=n;if(x>1){x=1;d=-1}if(x<0){x=0;d=1}m.style.left=x*100+'%';requestAnimationFrame(f)})(last);
  $('tg').onclick=()=>{tot+=Math.max(0,1-Math.abs(x-zc)/zw);vib(30);if(++r>=3){run=0;done(tot/3)}else nr()}},
 memory(a,done){const L=4,seq=[...Array(L)].map(()=>Math.random()*6|0);let i=0,ok=0;
  a.innerHTML='<div id=ms style="font-size:4rem;height:80px"></div><div class=mb id=mb></div>';
  const ms=$('ms'),mb=$('mb');mb.hidden=true;
  mb.innerHTML=SYM.map((y,k)=>`<button data-k="${k}">${y}</button>`).join('');
  let n=0;(function show(){if(n<L){ms.textContent=SYM[seq[n++]];setTimeout(()=>{ms.textContent='';setTimeout(show,250)},650)}else{ms.textContent='Jetzt du!';mb.hidden=false}})();
  mb.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(+b.dataset.k===seq[i])ok++;vib(25);if(+b.dataset.k!==seq[i]||++i>=L)done(ok/L)}},
 hotcold(a,done){const T=Math.random()*100;let tries=0;
  a.innerHTML='<input id=hs type=range min=0 max=100 value=50 style="width:260px"><p id=hf>Schiebe den Regler und prüfe.</p><button id=hb>Prüfen</button>';
  $('hb').onclick=()=>{tries++;const d=Math.abs(+$('hs').value-T);
   $('hf').textContent=(d<=4?'🎯 Treffer!':d<10?'🔥 kochend heiß':d<20?'♨️ heiß':d<35?'🙂 warm':d<55?'❄️ kalt':'🧊 eiskalt')+' ('+tries+'/6)';
   vib(d<10?[60,40,60]:20);if(d<=4)setTimeout(()=>done(Math.max(.5,1-(tries-1)*.1)),700);else if(tries>=6)setTimeout(()=>done(.25),700)}},
 stealth(a,done){let p=0,look=false,hold=0,fails=0,last=performance.now(),t0=last,next=last+1500,run=1;
  a.innerHTML='<div id=ey style="font-size:5rem"></div><div id=sb><i id=sf></i></div><p id=sm>Halte gedrückt und schleiche an.</p><button id=sh>Anschleichen (halten)</button>';
  const b=$('sh');b.onpointerdown=()=>hold=1;b.onpointerup=b.onpointerleave=b.onpointercancel=()=>hold=0;
  (function f(n){if(!run)return;const dt=(n-last)/1000;last=n;
   if(n>next){look=!look;next=n+(look?700+Math.random()*900:1200+Math.random()*1500)}
   $('ey').textContent=look?'👀':(next-n<350?'⚠️':'🦌');
   if(hold){if(look){p=Math.max(0,p-.3);fails++;hold=0;vib(150);$('sm').textContent='Das Tier hat dich gesehen!'}else p+=.25*dt}
   $('sf').style.width=Math.min(100,p*100)+'%';
   if(p>=1){run=0;return done(Math.max(.4,1-fails*.2))}
   if(n-t0>30000){run=0;return done(p*.5)}requestAnimationFrame(f)})(last)}};
const j=$('joy'),k=$('knob');let on=false;
function mv(e){if(!on)return;const r=j.getBoundingClientRect(),R=r.width/2-30;let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y);if(l>R){x*=R/l;y*=R/l}
 k.style.transform=`translate(${x}px,${y}px)`;s.emit('input',{dx:x/R,dy:y/R})}
j.onpointerdown=e=>{on=true;j.setPointerCapture(e.pointerId);mv(e)};j.onpointermove=mv;
j.onpointerup=j.onpointercancel=()=>{on=false;k.style.transform='';s.emit('input',{dx:0,dy:0})};
